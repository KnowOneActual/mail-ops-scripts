[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-ops-scripts"
version = "2.5.2"
description = "A unified operational toolkit for email server administration and DMARC analysis."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Beau Bremer", email = "beau.bremer@tutamial.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "build",
    "twine"
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
exclude = [
    '^build/',
    '^dist/',
    '^\.venv/',
    '^venv/'
]
python_version = "3.9"
strict = false
ignore_missing_imports = true


[project.scripts]
mailops = "mailops.cli:main"

[project.urls]
Homepage = "https://github.com/KnowOneActual/mail-ops-scripts"
Repository = "https://github.com/KnowOneActual/mail-ops-scripts"

[tool.setuptools.packages.find]
where = ["."]
include = ["mailops*"]
exclude = ["assets*", "assets*"]
namespaces = false
